name: Aylık Borç Hatırlatma

on:
  schedule:
    # Her ayın 5'i, saat 06:00 UTC = 09:00 TRT (Türkiye UTC+3)
    - cron: '0 6 5 * *'
  workflow_dispatch: {}   # manuel test için: Actions sekmesinden "Run workflow"

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bağımlılıkları kur
        run: pip install requests beautifulsoup4 pytefas

      - name: Bildirimi gönder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: python notify.py
